name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: python -m pip install pytest
      - name: Ejecutar pruebas
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Crear .env de prueba desde la plantilla
        run: cp .env.example .env
      - name: Construir las imagenes
        run: docker compose build
      - name: Levantar los contenedores
        run: docker compose up -d --wait
      - name: Probar comunicacion api -> db
        run: |
          for i in $(seq 1 15); do curl -sf localhost:5000/salud && break; sleep 2; done
          curl -sf -X POST localhost:5000/operaciones -H "Content-Type: application/json" -d '{"operacion":"sumar","a":2,"b":3}'
          curl -sf localhost:5000/operaciones | grep '"resultado":5.0'
      - name: Ver logs
        if: always()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
