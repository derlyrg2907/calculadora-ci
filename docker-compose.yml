services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: calculadora-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-calculadora
    restart: on-failure

  db:
    image: postgres:16.4-alpine
    container_name: calculadora-db
    env_file:
      - .env
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-calculadora

networks:
  red-calculadora:
    driver: bridge

volumes:
  datos-db:
